<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Portfolio de Franco Céspedes — dessinateur de bande dessinée et illustrateur.">
  <title>Franco Céspedes — Bande dessinée & Illustration</title>
  <link rel="icon" href="assets/logo-new.png">
  <link rel="stylesheet" href="style.css">

  <style>
    :root{--pad:clamp(18px,3vw,46px)}

    header{
      position:sticky;top:0;z-index:20;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:8px var(--pad) 8px;
      background:#f3f1ecef;backdrop-filter:blur(10px);
    }
    header .brand{display:block;line-height:0;margin:0 auto 5px}
    header img{width:190px;height:67px;object-fit:contain;object-position:center}
    nav{display:flex;justify-content:center;align-items:center;gap:25px;flex-wrap:wrap}
    nav a{font-size:12.5px;letter-spacing:.07em}
    .langs{position:absolute;right:var(--pad);top:19px;display:flex;gap:3px}
    .langs button{font-size:10.5px;letter-spacing:.07em}

    /* Entrada compacta: una sola línea y la obra aparece casi inmediatamente */
    .hero{
      min-height:0;max-width:1180px;margin:0 auto;
      padding:18px var(--pad) 10px;
      display:block;
    }
    .hero small,.hero p,.down{display:none}
    .hero h1{
      font-size:clamp(17px,1.7vw,23px);line-height:1.15;letter-spacing:-.018em;
      margin:0;font-weight:500;max-width:none;white-space:nowrap;
    }

    .work{max-width:1180px;margin:0 auto;padding:34px var(--pad) 10px;scroll-margin-top:115px}
    #bd{padding-top:12px}
    .sh{grid-template-columns:38px 1fr auto;padding:10px 0 18px}
    .sh b,.sh span{font-size:9px}
    .sh h2{font-size:clamp(22px,2.35vw,33px);letter-spacing:-.03em}

    .gallery{grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
    .gallery[data-section="sketches"]{grid-template-columns:repeat(5,minmax(0,1fr))}
    .mixed .card:nth-child(5n+1){grid-column:auto}
    .mixed .card:nth-child(5n+1) .frame{aspect-ratio:3/4}
    .card figcaption{padding:7px 0 13px;font-size:9px;line-height:1.25}
    .frame{aspect-ratio:3/4}

    .about{max-width:1180px;margin:64px auto 0;padding:52px var(--pad) 64px;gap:6vw}
    .about h2{font-size:clamp(27px,3.4vw,45px);letter-spacing:-.04em;margin:15px 0}
    .bio{font-size:clamp(14px,1.45vw,20px);line-height:1.38}
    .clients,.about div>p:not(.bio){font-size:11px;margin-top:18px}
    .contact-options{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px}
    .contact-options a{font-size:11px;border-bottom:1px solid;padding-bottom:4px}
    footer{max-width:1180px;margin:0 auto;padding:20px var(--pad);font-size:9px}

    @media(max-width:980px){
      nav{gap:17px}
      nav a{font-size:11.5px}
      .gallery{grid-template-columns:repeat(3,minmax(0,1fr))}
      .gallery[data-section="sketches"]{grid-template-columns:repeat(3,minmax(0,1fr))}
      .hero h1{white-space:normal}
    }
    @media(max-width:800px){
      header{padding-top:7px}
      header img{width:165px;height:58px}
      .langs{top:14px;right:14px}
      nav{width:100%;gap:13px;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;padding:3px 0 2px;scrollbar-width:none}
      nav::-webkit-scrollbar{display:none}
      nav a{font-size:10.5px;white-space:nowrap}
      .gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .gallery[data-section="sketches"]{grid-template-columns:repeat(2,minmax(0,1fr))}
      .hero{padding-top:13px;padding-bottom:6px}
      .hero h1{font-size:17px;white-space:normal}
      .about{grid-template-columns:1fr}
      .work{scroll-margin-top:126px;padding-top:28px}
      #bd{padding-top:10px}
    }
    @media(max-width:480px){
      header img{width:150px;height:54px}
      .langs{position:static;margin-top:5px}
      nav{order:2;margin-top:3px}
      .langs{order:3}
      .gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .frame,.mixed .card:nth-child(5n+1) .frame{aspect-ratio:3/4}
      .card img{height:100%;object-fit:cover}
      .hero h1{font-size:15px}
      .card figcaption{font-size:8px;display:block}.card figcaption span{display:block;margin-top:2px}
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#top"><img src="assets/logo-new.png" alt="Franco Céspedes"></a>
    <nav>
      <a href="#bd" data-i="navBd"></a>
      <a href="#illustration" data-i="navIll"></a>
      <a href="#jeunesse" data-i="navKids"></a>
      <a href="#characters" data-i="navCharacters"></a>
      <a href="#sketches" data-i="navSketches"></a>
      <a href="#about" data-i="navAbout"></a>
    </nav>
    <div class="langs">
      <button data-lang="fr">FR</button><button data-lang="en">EN</button><button data-lang="es">ES</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <h1 data-i="role"></h1>
    </section>

    <section id="bd" class="work"><div class="sh"><b>01</b><h2 data-i="bdTitle"></h2><span data-i="bdSub"></span></div><div class="gallery" data-section="bd"></div></section>
    <section id="illustration" class="work"><div class="sh"><b>02</b><h2 data-i="illTitle"></h2><span data-i="illSub"></span></div><div class="gallery mixed" data-section="illustration"></div></section>
    <section id="jeunesse" class="work"><div class="sh"><b>03</b><h2 data-i="kidsTitle"></h2><span data-i="kidsSub"></span></div><div class="gallery mixed" data-section="jeunesse"></div></section>
    <section id="characters" class="work"><div class="sh"><b>04</b><h2 data-i="charTitle"></h2><span data-i="charSub"></span></div><div class="gallery mixed" data-section="characters"></div></section>
    <section id="sketches" class="work"><div class="sh"><b>05</b><h2 data-i="sketchTitle"></h2><span data-i="sketchSub"></span></div><div class="gallery mixed" data-section="sketches"></div></section>

    <section id="about" class="about">
      <div><small data-i="aboutLabel"></small><h2>Franco Céspedes</h2></div>
      <div>
        <p class="bio" data-i="bio"></p>
        <p class="clients">Mattel · Netflix · Max · Paramount · IDW Publishing</p>
        <p data-i="availability"></p>
        <div class="contact-options">
          <a href="mailto:francocespedes2@gmail.com">francocespedes2@gmail.com ↗</a>
          <a href="https://wa.me/50688305683" target="_blank" rel="noopener">WhatsApp +506 8830 5683 ↗</a>
        </div>
      </div>
    </section>
  </main>

  <footer><span>© 2026 Franco Céspedes</span><a href="#top" data-i="back"></a></footer>

  <div class="lightbox">
    <button class="close" aria-label="Close">×</button><button class="prev" aria-label="Previous">←</button>
    <figure><img alt=""><figcaption><strong></strong><span></span></figcaption></figure>
    <button class="next" aria-label="Next">→</button>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
